
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Express TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:white;font-family:Arial,sans-serif}
header{background:#111a2d;padding:20px;text-align:center;border-bottom:2px solid #16c7a0}
header h1{margin:0;color:#16c7a0}
main{max-width:900px;margin:auto;padding:20px}
.panel{background:#151e30;padding:20px;border-radius:14px;margin-bottom:18px}
input,button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:8px;font-size:16px}
input{background:#26334a;color:white}
button{background:#13bd98;color:#07130f;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#status{color:#ffc76b;margin-top:10px}
#channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.channel{background:#26334a;padding:14px;border-radius:9px;cursor:pointer}
.channel:hover{background:#176d61}
video{width:100%;background:black;border-radius:12px;max-height:55vh}
.hidden{display:none}
small{color:#aebbd0}
</style>
</head>
<body>
<header><h1>EXPRESS TV</h1><small>Seu player IPTV</small></header>
<main>
<section class="panel" id="login">
<h2>Conectar ao IPTV</h2>
<p><small>Entre com os dados do seu serviço IPTV autorizado.</small></p>
<input id="server" placeholder="Endereço do servidor (https://...)">
<input id="username" placeholder="Usuário">
<input id="password" type="password" placeholder="Senha">
<button id="connect" onclick="connect()">CONECTAR</button>
<div id="status"></div>
</section>

<section class="panel hidden" id="player">
<h2 id="playing">Escolha um canal</h2>
<video id="video" controls playsinline></video>
<button onclick="disconnect()">DESCONECTAR</button>
</section>

<section class="panel hidden" id="list">
<h2>Canais disponíveis</h2>
<input id="search" placeholder="Pesquisar canal..." oninput="filterChannels()">
<div id="channels"></div>
</section>
</main>

<script>
let base="",user="",pass="",allChannels=[],hls=null;

async function connect(){
 const status=document.getElementById("status");
 const btn=document.getElementById("connect");
 base=document.getElementById("server").value.trim().replace(/\/+$/,"");
 user=document.getElementById("username").value.trim();
 pass=document.getElementById("password").value;
 if(!base||!user||!pass){status.textContent="Preencha os três campos.";return}
 if(!/^https?:\/\//i.test(base)){status.textContent="Informe o endereço começando com https:// ou http://";return}
 btn.disabled=true;status.textContent="Conectando...";
 try{
  const url=base+"/player_api.php?username="+encodeURIComponent(user)+"&password="+encodeURIComponent(pass);
  const response=await fetch(url);
  if(!response.ok)throw new Error("Servidor respondeu com erro "+response.status);
  const data=await response.json();
  if(!data.user_info||String(data.user_info.auth)!=="1")throw new Error("Usuário ou senha não autorizados.");
  const r=await fetch(url+"&action=get_live_streams");
  if(!r.ok)throw new Error("Não foi possível carregar os canais.");
  allChannels=await r.json();
  if(!Array.isArray(allChannels))throw new Error("Resposta de canais inválida.");
  document.getElementById("login").classList.add("hidden");
  document.getElementById("player").classList.remove("hidden");
  document.getElementById("list").classList.remove("hidden");
  render(allChannels);
 }catch(e){
  status.textContent="Não foi possível conectar: "+e.message+". O servidor precisa permitir acesso pelo navegador (CORS).";
 }finally{btn.disabled=false}
}

function render(items){
 const box=document.getElementById("channels");box.innerHTML="";
 items.forEach(ch=>{
  const el=document.createElement("div");el.className="channel";
  el.textContent=ch.name||"Canal";
  el.onclick=()=>play(ch);
  box.appendChild(el);
 });
 if(!items.length)box.textContent="Nenhum canal encontrado.";
}

function filterChannels(){
 const q=document.getElementById("search").value.toLowerCase();
 render(allChannels.filter(c=>(c.name||"").toLowerCase().includes(q)));
}

function play(ch){
 const video=document.getElementById("video");
 const id=encodeURIComponent(ch.stream_id);
 const src=base+"/live/"+encodeURIComponent(user)+"/"+encodeURIComponent(pass)+"/"+id+".m3u8";
 document.getElementById("playing").textContent=ch.name||"Reproduzindo";
 if(hls){hls.destroy();hls=null}
 if(Hls.isSupported()){
  hls=new Hls();hls.loadSource(src);hls.attachMedia(video);
  hls.on(Hls.Events.ERROR,(event,data)=>{if(data.fatal)document.getElementById("playing").textContent="Erro ao reproduzir este canal";});
 }else if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=src}
 else{document.getElementById("playing").textContent="Este navegador não suporta este formato."}
 video.play().catch(()=>{});
}

function disconnect(){
 if(hls){hls.destroy();hls=null}
 const video=document.getElementById("video");video.pause();video.removeAttribute("src");video.load();
 user="";pass="";base="";allChannels=[];
 document.getElementById("player").classList.add("hidden");
 document.getElementById("list").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("status").textContent="Desconectado.";
}
</script>
</body>
</html>
